# dsh-tool-lazy-gate bundle patch: one host-plane row gating configured tool
# families (browser_*, computer_use_*, taskboard_* in this profile) per session.
# Unlock is USER-explicit
# skill invocation only; a model skill() call can never grant itself access.
#
# Skill Names are the authoritative gate selectors. Tool prefixes and prompt
# sections are derived from the selected adapted skill (metadata['dsh:gate']); the
# host keeps a narrow browser/computer compatibility mapping for older plugins.

# Temporary compatibility patch for DSH 0.1.5's client-connection regression.
#
# @deepseek-ai/dsh-client-connection.rpc.handle() still registers a private
# channel through owner.webServer, but the 0.1.5 Web connection entry only
# injects webRuntime. When this plugin registers /tool-lazy-gate from a
# ctx.inject(['connection'], ...) scope, the missing webServer injection makes
# registration fail with "cannot get property webServer without inject". The
# browser then sees the SPA fallback's HTTP 405 and falls back to built-in
# associations, hiding adapted skills such as taskboard and open-record-replay.
#
# Keep this patch until the official connection package fixes its registration
# context. Remove it after that release is adopted; the plugin itself should
# continue to surface real registration errors rather than swallowing them.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webRuntime, webServer]

- insert:
    - id: tool-lazy-gate
      name: dsh-tool-lazy-gate
      config:
        capabilities:
          browser:
            enabled: true
            skillNames: [browser]
          computer:
            enabled: true
            skillNames: [computer-use]
          taskboard:
            enabled: true
            skillNames: [taskboard]
