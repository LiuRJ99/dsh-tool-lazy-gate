# dsh-tool-lazy-gate bundle patch: one host-plane row gating configured tool
# families (browser_*, computer_use_*, taskboard_* in this profile) per session.
# Unlock is USER-explicit
# skill invocation only; a model skill() call can never grant itself access.
#
# Skill Names are the authoritative gate selectors. Tool prefixes and prompt
# sections are derived from the selected adapted skill (metadata['dsh:gate']); the
# host keeps a narrow browser/computer compatibility mapping for older plugins.

- insert:
    - id: tool-lazy-gate
      name: dsh-tool-lazy-gate
      config:
        capabilities:
          browser:
            enabled: true
            skillNames: [browser]
          computer:
            enabled: true
            skillNames: [computer-use]
          taskboard:
            enabled: true
            skillNames: [taskboard]
