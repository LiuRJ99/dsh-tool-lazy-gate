# dsh-tool-lazy-gate bundle patch: one host-plane row gating the high-privilege
# browser_* / computer_use_* tool families per session. Unlock is USER-explicit
# skill invocation only; a model skill() call can never grant itself access.
#
# Capabilities are data-driven: tool prefixes, skill names, and prompt sections
# are config, so swapping a browser/computer plugin only changes this file.

- insert:
    - id: tool-lazy-gate
      name: dsh-tool-lazy-gate
      config:
        capabilities:
          browser:
            enabled: true
            skillNames: [browser]
            toolPrefixes: [browser_]
            promptSections: [tool:bridge-browser]
          computer:
            enabled: true
            skillNames: [computer-use]
            toolPrefixes: [computer_use_]
            promptSections:
              - tool:computer
              - tool:computer-policy
